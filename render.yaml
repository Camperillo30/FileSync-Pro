services:
  - type: web
    name: filesync-pro-api
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements-backend.txt
    startCommand: python -m uvicorn backend_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FILESYNC_PRO_SITE_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: FILESYNC_PRO_PRICE
        value: "49.99"
      - key: FILESYNC_PRO_CURRENCY
        value: COP
      - key: FILESYNC_PRO_MAX_ACTIVATIONS
        value: "2"
